name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Apple Silicon runner; Yoinks supports Apple Silicon only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Disk image
        env:
          YOINKS_SKIP_REGISTER: "1"
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Yoinks-dmg
          path: target/release/Yoinks-*.dmg
          if-no-files-found: error
