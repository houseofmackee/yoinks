[package]
name = "yoinks"
version = "0.6.1"
edition = "2024"
description = "A drag-and-drop shelf for macOS, inspired by Yoink"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
objc2-quick-look-ui = "0.3"
objc2-quick-look-thumbnailing = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
dispatch2 = "0.3"
objc2-uniform-type-identifiers = "0.3"
objc2-service-management = "0.3"
objc2-vision = "0.3"
objc2-quartz-core = { version = "0.3", features = ["objc2-core-foundation", "objc2-core-graphics"] }

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
