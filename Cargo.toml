[package]
name = "yoinks"
version = "0.1.0"
edition = "2024"
description = "A drag-and-drop shelf for macOS, inspired by Yoink"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["objc2-core-foundation"] }

[package.metadata.bundle]
name = "Yoinks"
identifier = "io.github.yoinks"
osx_minimum_system_version = "13.0"
category = "public.app-category.productivity"
